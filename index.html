<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b3f7a">
<title>Park Pals</title>
<style>
  :root { --panel: 190px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3b3f7a; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #view { position: relative; flex: 1; min-height: 0; background: #2a8f4a; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* HUD */
  #hud { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; z-index: 2; pointer-events: none; }
  .chip { background: rgba(255,255,255,.85); border-radius: 22px; padding: 2px 12px; font-size: 24px; font-weight: 800; color: #3b3f7a; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .chip.bump { animation: bump .35s; }
  @keyframes bump { 40% { transform: scale(1.35); } }
  #topbtns { position: absolute; top: 8px; right: 8px; display: flex; gap: 8px; z-index: 3; }
  .tb { width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255,255,255,.88); font-size: 28px; box-shadow: 0 3px 0 rgba(0,0,0,.2); cursor: pointer; }
  .tb:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }

  /* Character select */
  #select { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px;
    background: radial-gradient(circle at 30% 20%, #fff7b8 0, transparent 40%), linear-gradient(#8fd6ff, #c9f0ff 55%, #9be37a 55%, #7ed957); }
  #select h1 { margin: 0; font-size: clamp(24px, 6vw, 44px); color: #3b3f7a; text-align: center; text-shadow: 0 3px 0 #fff; }
  #cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 760px; }
  .card { width: clamp(92px, 27vw, 132px); border: 5px solid #fff; border-radius: 22px; background: #fff9; padding: 4px 4px 6px; text-align: center; font-weight: 900; font-size: clamp(16px, 4vw, 22px); color: #3b3f7a; cursor: pointer; transition: transform .12s; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
  .card canvas { width: 100%; height: auto; aspect-ratio: 1; display: block; }
  .card.sel { border-color: #ff4f6d; background: #fff; transform: scale(1.1); }
  #select .hint { font-size: 18px; font-weight: 800; color: #3b3f7a; }

  /* Controller */
  #pad { height: var(--panel); flex: none; position: relative; background: linear-gradient(#4a4f94, #343870); border-top: 5px solid #232652; }
  #stick { position: absolute; left: 22px; bottom: 22px; width: 146px; height: 146px; border-radius: 50%; background: radial-gradient(#23264f, #181a38); box-shadow: inset 0 0 0 5px #5d63b3, 0 4px 0 rgba(0,0,0,.3); }
  #stick::before, #stick::after { content: ""; position: absolute; background: #5d63b3; opacity: .5; }
  #stick::before { left: 50%; top: 14px; bottom: 14px; width: 4px; margin-left: -2px; }
  #stick::after  { top: 50%; left: 14px; right: 14px; height: 4px; margin-top: -2px; }
  #knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9db0, #e8334f 70%); box-shadow: 0 4px 0 #8c1f33; pointer-events: none; }
  .btn { position: absolute; width: 82px; height: 82px; border-radius: 50%; border: 0; font: 900 38px "Trebuchet MS", system-ui, sans-serif; color: #fff; cursor: pointer; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .btn.down, .btn:active { transform: translateY(4px); }
  #btnA { right: 20px; bottom: 86px; background: radial-gradient(circle at 35% 30%, #7ff0a0, #1fb85a 70%); box-shadow: 0 6px 0 #0e7a38; }
  #btnB { right: 118px; bottom: 28px; background: radial-gradient(circle at 35% 30%, #ffe27a, #f5a50f 70%); box-shadow: 0 6px 0 #a56a00; }
  #btnA.down, #btnA:active { box-shadow: 0 2px 0 #0e7a38; }
  #btnB.down, #btnB:active { box-shadow: 0 2px 0 #a56a00; }
  #btnA.glow { animation: glow .8s infinite; }
  @keyframes glow { 50% { box-shadow: 0 6px 0 #0e7a38, 0 0 0 12px rgba(127,240,160,.55); } }
  .lbl { position: absolute; color: #c9ccff; font-weight: 800; font-size: 13px; letter-spacing: 1px; }

  /* Phones held sideways: controls float over the game */
  @media (max-height: 520px) and (orientation: landscape) {
    #pad { position: absolute; inset: 0; height: auto; background: none; border: 0; pointer-events: none; z-index: 3; }
    #stick, .btn { pointer-events: auto; opacity: .85; }
    #stick { left: 18px; bottom: 14px; width: 128px; height: 128px; }
    #knob { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
    .btn { width: 72px; height: 72px; font-size: 32px; }
    #btnA { right: 16px; bottom: 74px; }
    #btnB { right: 102px; bottom: 22px; }
    .lbl { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="chip" id="cStars">⭐ <span>0</span></div>
      <div class="chip" id="cFlowers">🌸 <span>0</span></div>
      <div class="chip" id="cBalloons">🎈 <span>0</span></div>
    </div>
    <div id="topbtns">
      <button class="tb" id="btnMute" aria-label="Sound">🔊</button>
      <button class="tb" id="btnSwap" aria-label="Change friend">🔄</button>
    </div>
    <div id="select">
      <h1>Who do you want to be? 🌟</h1>
      <div id="cards"></div>
      <div class="hint">Tap a friend to play!</div>
    </div>
  </div>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <button class="btn" id="btnA" aria-label="A button">A</button>
    <button class="btn" id="btnB" aria-label="B button">B</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const OUT = '#2a2030';

/* ------------------------------------------------------------------ *
 *  Sound (tiny WebAudio blips, no files needed)
 * ------------------------------------------------------------------ */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d = .15, type = 'sine', vol = .2, to = null, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
function noise(d = .2, vol = .2, freq = 1500, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
  const g = a.createGain(); const t = a.currentTime + delay; g.gain.setValueAtTime(vol, t);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const SFX = {
  pop:    () => { noise(.12, .5, 1800); tone(520, .1, 'sine', .25, 120); },
  chime:  () => { tone(784, .14, 'triangle', .25); tone(1175, .26, 'triangle', .25, null, .09); },
  star:   () => { [988, 1319, 1568].forEach((f, i) => tone(f, .14, 'triangle', .22, null, i * .06)); },
  boing:  () => tone(220, .28, 'sine', .3, 700),
  splash: () => { noise(.35, .45, 900); noise(.25, .3, 2400, .05); tone(400, .15, 'sine', .12, 200); },
  quack:  () => { tone(520, .09, 'sawtooth', .16, 380); tone(480, .11, 'sawtooth', .16, 340, .12); },
  bell:   () => { tone(880, .5, 'sine', .25); tone(660, .7, 'sine', .25, null, .35); },
  yum:    () => { tone(300, .12, 'sine', .25, 500); tone(350, .12, 'sine', .25, 560, .14); tone(420, .2, 'sine', .25, 700, .28); },
  kick:   () => { tone(180, .12, 'sine', .35, 70); noise(.06, .25, 600); },
  hi:     () => { tone(660, .1, 'triangle', .22); tone(880, .14, 'triangle', .22, null, .08); },
  fanfare:() => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .2, 'square', .13, null, i * .11)); },
  voice(id) {
    if (id === 'mickey') { tone(620, .09, 'square', .12, 760); tone(760, .09, 'square', .12, 900, .11); tone(700, .16, 'square', .12, 560, .22); }
    else if (id === 'minnie') { tone(900, .09, 'triangle', .22, 1100); tone(1100, .09, 'triangle', .22, 1300, .11); tone(1000, .16, 'triangle', .22, 800, .22); }
    else if (id === 'donald') { SFX.quack(); tone(400, .12, 'sawtooth', .14, 300, .26); }
    else if (id === 'goofy') { tone(300, .18, 'triangle', .3, 420); tone(420, .3, 'triangle', .3, 260, .18); }
    else { tone(240, .1, 'sawtooth', .22, 150); tone(240, .12, 'sawtooth', .22, 140, .16); }
  }
};

/* ------------------------------------------------------------------ *
 *  Characters (all drawn with shapes, 48 "pixels" tall, feet at 0,0)
 * ------------------------------------------------------------------ */
const ORDER = ['mickey', 'minnie', 'donald', 'goofy', 'pluto'];
const CHARS = {
  mickey: { name: 'Mickey', skin: '#ffd9b0', body: '#e8333d', pants: '#e8333d', shoe: '#ffd23f', hand: '#fff', emoji: ['🧀', '⭐', '😄', '🎈'] },
  minnie: { name: 'Minnie', skin: '#ffd9b0', body: '#ff5fa2', pants: '#ff5fa2', shoe: '#ff2f86', hand: '#fff', emoji: ['🎀', '🌸', '💖', '🍰'] },
  donald: { name: 'Donald', skin: '#fff', body: '#2b5fc2', pants: '#2b5fc2', shoe: '#ff9d1c', hand: '#fff', emoji: ['🦆', '💦', '⛵', '😆'] },
  goofy:  { name: 'Goofy',  skin: '#f2c99a', body: '#ff9a2e', pants: '#3a64c8', shoe: '#7a4a1f', hand: '#fff', emoji: ['😜', '🎣', '🏀', '👍'] },
  pluto:  { name: 'Pluto',  emoji: ['🦴', '🐾', '🎾', '💛'] }
};
const DIRS = { down: { x: 0, y: 1 }, up: { x: 0, y: -1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };

let LW = .04; // outline width: world units normally, 1.5 inside character space
function ell(c, x, y, rx, ry, fill, stroke) {
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = LW; c.stroke(); }
}
function rr(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
}

function drawPerson(c, id, dir, t, moving, wave) {
  const S = CHARS[id], side = dir === 'left' || dir === 'right', back = dir === 'up', front = dir === 'down';
  c.save();
  if (dir === 'left') c.scale(-1, 1);
  const sw = moving ? Math.sin(t * 13) : 0;
  c.translate(0, moving ? -Math.abs(Math.sin(t * 13)) * 1.8 : 0);

  // shoes
  if (side) { ell(c, -3 - sw * 3.5, -3, 6, 3.2, S.shoe, OUT); ell(c, 3 + sw * 3.5, -3.5, 6, 3.2, S.shoe, OUT); }
  else { ell(c, -5, -3 - Math.max(0, sw) * 2.5, 5.5, 3.3, S.shoe, OUT); ell(c, 5, -3 - Math.max(0, -sw) * 2.5, 5.5, 3.3, S.shoe, OUT); }

  // tail for Donald (back view)
  if (id === 'donald' && back) ell(c, 0, -10, 4, 3, '#fff', OUT);

  // body
  const skirt = id === 'minnie' ? 11.5 : 8.8;
  ell(c, 0, -10.5, skirt, 6.5, S.pants, OUT);
  ell(c, 0, -17, id === 'minnie' ? 8.6 : 9.2, 7.6, S.body, OUT);
  if (!back) {
    if (id === 'mickey' && front) { ell(c, -4.5, -13, 1.9, 2.4, '#ffd23f', OUT); ell(c, 4.5, -13, 1.9, 2.4, '#ffd23f', OUT); }
    if (id === 'minnie' && front) { [[-5, -11], [4, -9], [0, -14], [7, -14], [-7, -15]].forEach(p => ell(c, p[0], p[1], 1.5, 1.5, '#fff')); }
    if (id === 'donald') { c.beginPath(); c.moveTo(-6, -23); c.lineTo(6, -23); c.lineTo(0, -15); c.closePath(); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = OUT; c.lineWidth = 1.2; c.stroke(); ell(c, 0, -22, 3.2, 1.8, '#e8333d', OUT); }
    if (id === 'goofy') { ell(c, 0, -19, 2, 5, '#ffd23f'); }
  }

  // hands
  if (side) { ell(c, -sw * 4, -16, 3.4, 3.4, S.hand, OUT); }
  else {
    const lh = -16 + sw * 1.5;
    ell(c, -11, lh, 3.5, 3.5, S.hand, OUT);
    if (wave > 0) ell(c, 12, -30 + Math.sin(t * 22) * 3, 3.6, 3.6, S.hand, OUT);
    else ell(c, 11, -16 - sw * 1.5, 3.5, 3.5, S.hand, OUT);
  }

  // ---- heads ----
  if (id === 'mickey' || id === 'minnie') {
    const ink = '#26232b';
    if (side) { ell(c, -5.5, -43, 7, 7, ink, OUT); }
    else { ell(c, -11, -41.5, 7.2, 7.2, ink, OUT); ell(c, 11, -41.5, 7.2, 7.2, ink, OUT); }
    ell(c, side ? -1 : 0, -31, 11.5, 10.5, ink, OUT);
    if (side) ell(c, 5.5, -41, 5.8, 5.8, ink, OUT);
    if (front) {
      ell(c, 0, -28.5, 9, 7.8, S.skin);
      ell(c, -3.6, -31.5, 2.7, 3.7, '#fff', OUT); ell(c, 3.6, -31.5, 2.7, 3.7, '#fff', OUT);
      ell(c, -3.4, -31, 1.3, 2, ink); ell(c, 3.8, -31, 1.3, 2, ink);
      ell(c, 0, -27.3, 3.3, 2.3, ink);
      c.beginPath(); c.arc(0, -27, 5.4, .25 * Math.PI, .75 * Math.PI); c.strokeStyle = OUT; c.lineWidth = 1.4; c.stroke();
      if (id === 'minnie') { ell(c, -6.5, -26.5, 1.8, 1.2, 'rgba(255,90,130,.55)'); ell(c, 6.5, -26.5, 1.8, 1.2, 'rgba(255,90,130,.55)'); c.beginPath(); c.moveTo(-6.5, -34); c.lineTo(-4.5, -35.4); c.moveTo(6.5, -34); c.lineTo(4.5, -35.4); c.strokeStyle = OUT; c.lineWidth = 1.2; c.stroke(); }
    } else if (side) {
      ell(c, 4.6, -29, 7.6, 7.2, S.skin);
      ell(c, 6.2, -32, 2.3, 3.4, '#fff', OUT); ell(c, 7.2, -31.6, 1.2, 1.9, ink);
      ell(c, 11, -29, 3, 2.6, ink);
      c.beginPath(); c.arc(7, -27.5, 4, .2 * Math.PI, .7 * Math.PI); c.strokeStyle = OUT; c.lineWidth = 1.3; c.stroke();
    }
    if (id === 'minnie') { // bow
      const bx = side ? -1 : 0, by = -44.5;
      c.fillStyle = '#ff2f86'; c.strokeStyle = OUT; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(bx, by); c.lineTo(bx - 9, by - 5); c.lineTo(bx - 9, by + 4); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + 9, by - 5); c.lineTo(bx + 9, by + 4); c.closePath(); c.fill(); c.stroke();
      ell(c, bx, by, 2.6, 2.6, '#ff2f86', OUT);
    }
  } else if (id === 'donald') {
    ell(c, side ? -1 : 0, -31, 11, 10, '#fff', OUT);
    if (front) {
      ell(c, -3.5, -31.5, 2.7, 3.4, '#fff', OUT); ell(c, 3.5, -31.5, 2.7, 3.4, '#fff', OUT);
      ell(c, -3.3, -31, 1.2, 1.8, '#222'); ell(c, 3.7, -31, 1.2, 1.8, '#222');
      ell(c, 0, -26.5, 7.8, 3.3, '#ff9d1c', OUT);
    } else if (side) {
      ell(c, 5.5, -32, 2.5, 3.2, '#fff', OUT); ell(c, 6.5, -31.6, 1.2, 1.7, '#222');
      ell(c, 11, -27.5, 8, 3.2, '#ff9d1c', OUT);
    }
    // sailor hat
    c.beginPath(); c.ellipse(side ? -1 : 0, -39, 11.2, 8, 0, Math.PI, 0); c.closePath(); c.fillStyle = '#2b5fc2'; c.fill(); c.strokeStyle = OUT; c.lineWidth = 1.5; c.stroke();
    rr(c, (side ? -1 : 0) - 11.2, -40, 22.4, 3.2, 1.5); c.fillStyle = '#fff'; c.fill(); c.stroke();
  } else if (id === 'goofy') {
    // hanging ears
    if (side) { ell(c, -6, -26, 4.2, 10, '#26232b', OUT); }
    else { ell(c, -12, -27, 4, 9.5, '#26232b', OUT); ell(c, 12, -27, 4, 9.5, '#26232b', OUT); }
    ell(c, side ? -1 : 0, -31, 9.8, 11.2, S.skin, OUT);
    if (front) {
      ell(c, -3.4, -33, 2.6, 3.4, '#fff', OUT); ell(c, 3.4, -33, 2.6, 3.4, '#fff', OUT);
      ell(c, -3.2, -32.6, 1.2, 1.7, '#222'); ell(c, 3.6, -32.6, 1.2, 1.7, '#222');
      ell(c, 0, -26, 6.3, 5, '#f7dcb8', OUT);
      ell(c, 0, -28.4, 3.8, 2.6, '#26232b');
      c.beginPath(); c.arc(0, -25.5, 3.6, .15 * Math.PI, .85 * Math.PI); c.strokeStyle = OUT; c.lineWidth = 1.3; c.stroke();
    } else if (side) {
      ell(c, 5.6, -33, 2.5, 3.3, '#fff', OUT); ell(c, 6.6, -32.6, 1.2, 1.7, '#222');
      ell(c, 10.5, -27, 8, 5.4, '#f7dcb8', OUT);
      ell(c, 17.5, -28.5, 3.2, 2.5, '#26232b');
    }
    // green hat
    const hx = side ? -1 : 0;
    ell(c, hx, -42, 8.6, 4.6, '#6a8f3a', OUT);
    rr(c, hx - 11, -42.2, 22, 3, 1.5); c.fillStyle = '#6a8f3a'; c.fill(); c.strokeStyle = OUT; c.lineWidth = 1.4; c.stroke();
  }
  c.restore();
}

function drawDog(c, id, dir, t, moving, wave) {
  const fur = '#f4a63a', ear = '#7a4a1f', snout = '#f9d28a', nose = '#26232b';
  const sw = moving ? Math.sin(t * 13) : 0, wag = Math.sin(t * (wave > 0 ? 28 : 12)) * .55;
  c.save();
  if (dir === 'left') c.scale(-1, 1);
  c.translate(0, moving ? -Math.abs(Math.sin(t * 13)) * 1.6 : 0);
  if (dir === 'right' || dir === 'left') {
    // back legs, tail
    ell(c, -9 + sw * 3, -3, 3.4, 4, fur, OUT);
    ell(c, 5 - sw * 3, -3, 3.4, 4, fur, OUT);
    c.save(); c.translate(-13, -15); c.rotate(-.9 + wag); ell(c, 0, -5, 2.6, 7, fur, OUT); c.restore();
    ell(c, -2, -11, 12.5, 7.5, fur, OUT);
    ell(c, -5 - sw * 3, -3, 3.4, 4.2, fur, OUT);
    ell(c, 9 + sw * 3, -3, 3.4, 4.2, fur, OUT);
    ell(c, 8, -20, 9, 8.4, fur, OUT);
    ell(c, 15.5, -17.5, 5.3, 3.8, snout, OUT); ell(c, 19.5, -18.5, 2.3, 1.8, nose);
    ell(c, 11.5, -22.5, 1.6, 2.1, nose);
    c.save(); c.translate(5, -22); c.rotate(.15); ell(c, 0, 4, 3.8, 7.5, ear, OUT); c.restore();
    c.beginPath(); c.moveTo(1.5, -16.5); c.lineTo(8, -16.5); c.lineTo(8, -14); c.lineTo(1.5, -14); c.fillStyle = '#d93a3a'; c.fill();
  } else if (dir === 'up') {
    ell(c, -5, -3 - Math.max(0, sw) * 2, 4, 3.4, fur, OUT); ell(c, 5, -3 - Math.max(0, -sw) * 2, 4, 3.4, fur, OUT);
    ell(c, 0, -12, 10, 9.5, fur, OUT);
    c.save(); c.translate(0, -15); c.rotate(wag); ell(c, 0, -3, 2.6, 6.5, fur, OUT); c.restore();
    ell(c, 0, -26, 10, 9, fur, OUT);
    c.save(); c.translate(-11, -27); c.rotate(.2); ell(c, 0, 3, 4.2, 9.5, ear, OUT); c.restore();
    c.save(); c.translate(11, -27); c.rotate(-.2); ell(c, 0, 3, 4.2, 9.5, ear, OUT); c.restore();
  } else {

  for (const d of ducks) out.push({ k: 'duck', o: d, x: d.x, y: d.y - .2, my: d.y - .9, r: 2.1 });

  out.push({ k: 'ball', o: ball, x: ball.x, y: ball.y - .2, my: ball.y - .95, r: 1.1 });

  for (let ty = Math.floor(py) - 2; ty <= Math.floor(py) + 2; ty++) for (let tx = Math.floor(px) - 2; tx <= Math.floor(px) + 2; tx++) {

const pick = a => a[Math.floor(Math.random() * a.length)];

/* ------------------------------------------------------------------ *
 *  Update
 * ------------------------------------------------------------------ */
function update(dt) {
  time += dt;
  if (mode !== 'play') return;
  // player
  const v = getVec(); P.moving = v.m > .08;
  if (P.moving) {
    const sp = 3.4 * (.5 + .5 * v.m);
    moveEnt(P, v.x * sp * dt, v.y * sp * dt);
    P.dir = Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'right' : 'left') : (v.y > 0 ? 'down' : 'up');
    P.anim += dt; P.wave = 0;
  }
  if (P.hop > 0) { P.hop = Math.max(0, P.hop - dt); if (P.spin) { const o = ['down', 'right', 'up', 'left']; P.dir = o[Math.floor((1 - P.hop / .6) * 8) % 4]; } }
  if (P.wave > 0) { P.wave -= dt; P.anim += dt; }

  // friends wander
  for (const n of friends) {
    n.anim += dt; if (n.hop > 0) n.hop -= dt;
    if (n.wave > 0) { n.wave -= dt; n.moving = false; continue; }
    n.timer -= dt;
    if (n.timer <= 0) {
      n.timer = 1 + Math.random() * 2.2;
      if (Math.random() < .35) n.moving = false;
      else {
        const names = Object.keys(DIRS); let d = pick(names);
        if (Math.hypot(n.x - n.hx, n.y - n.hy) > 5) d = Math.abs(n.hx - n.x) > Math.abs(n.hy - n.y) ? (n.hx > n.x ? 'right' : 'left') : (n.hy > n.y ? 'down' : 'up');
        n.dir = d; n.moving = true;
      }
    }
    if (n.moving) { const d = DIRS[n.dir]; if (moveEnt(n, d.x * 1.4 * dt, d.y * 1.4 * dt)) n.timer = 0; }
  }

  // ducks swim in circles
  for (const d of ducks) {
    const a = time * d.sp + d.ph, nx = POND.x + Math.cos(a) * 2.1, ny = POND.y + Math.sin(a) * 1.05;
    d.face = Math.sin(a) * -1 >= 0 ? 1 : -1; d.x = nx; d.y = ny; if (d.jump > 0) d.jump -= dt;
  }

  // regrow
  for (const f of flowers) if (f.gone && (f.t -= dt) <= 0) { f.gone = false; sparkle(f.x, f.y - .1, f.color); }
  for (const b of balloons) if (b.gone && (b.t -= dt) <= 0) b.gone = false;
  if (door.open > 0) door.open -= dt;

  // stars
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    if (Math.hypot(s.x - P.x, s.y - (P.y - .3)) < .6) {
      stars.splice(i, 1); setCount('stars', 'cStars'); sparkle(s.x, s.y - .3, '#ffd23f');
      if (counts.stars % 5 === 0) { SFX.fanfare(); burst(P.x, P.y - 1, 30, ['#ff4f6d', '#ffd23f', '#4fa3ff', '#5fd17f', '#b07cff'], 'conf', 4, 1.3, 4); bubble(P, '🎉', -1.5, 1.8); }
      else SFX.star();
      setTimeout(spawnStar, 1500);
    }
  }

  // ball
  const pc = { x: P.x, y: P.y - .3 }, bd = Math.hypot(ball.x - pc.x, ball.y - pc.y);
  if (bd < .5 && P.moving) { const nx = (ball.x - pc.x) / (bd || 1), ny = (ball.y - pc.y) / (bd || 1); ball.vx = nx * 4.2; ball.vy = ny * 4.2; }
  let ox = ball.x, oy = ball.y;
  ball.x += ball.vx * dt; if (blocked(ball.x, ball.y, .18, .18)) { ball.x = ox; ball.vx *= -.6; }
  ball.y += ball.vy * dt; if (blocked(ball.x, ball.y, .18, .18)) { ball.y = oy; ball.vy *= -.6; }
  const fr = Math.pow(.18, dt); ball.vx *= fr; ball.vy *= fr;

  // particles & bubbles
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt * (p.type === 'heart' ? -.15 : 1); p.rot += dt * 6; }
  for (let i = bubbles.length - 1; i >= 0; i--) if ((bubbles[i].t -= dt) <= 0) bubbles.splice(i, 1);

  // camera
  const vw = W / tp, vh = H / tp;
  let tx = P.x - vw / 2, ty = P.y - .5 - vh / 2;
  tx = vw >= MW ? (MW - vw) / 2 : Math.max(0, Math.min(MW - vw, tx));
  ty = vh >= MH ? (MH - vh) / 2 : Math.max(0, Math.min(MH - vh, ty));

}

}
function drawGround(c) {

    }

    c.fillStyle = '#58c4ee'; c.fillRect(x, y, 1.02, 1.02);

    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = .04; c.beginPath(); c.moveTo(x + .2 + o * .08, y + .35); c.quadraticCurveTo(x + .35, y + .27, x + .5 + o * .08, y + .35); c.moveTo(x + .5, y + .72); c.quadraticCurveTo(x + .65, y + .64, x + .8, y + .72); c.stroke();

function drawPicnic(c) {

  c.save(); rr(c, x, y, w, h, .08); c.fillStyle = '#ff6b6b'; c.fill(); c.clip();

function drawFlower(c, f) {
  if (f.gone) return;
  const sw = Math.sin(time * 2 + f.x) * .03;
  c.strokeStyle = '#3f9e3f'; c.lineWidth = .05; c.beginPath(); c.moveTo(f.x, f.y); c.lineTo(f.x + sw, f.y - .28); c.stroke();

  for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; ell(c, f.x + sw + Math.cos(a) * .11, f.y - .34 + Math.sin(a) * .11, .09, .09, f.color, 'rgba(0,0,0,.25)'); }

function drawTree(c, tx, ty) {

function drawHouse(c) {

  rr(c, 13.15, 2.85, 3.7, 2.1, .1); c.fillStyle = '#fff1c9'; c.fill(); c.strokeStyle = OUT; c.lineWidth = .06; c.stroke();
  c.beginPath(); c.moveTo(12.6, 3.1); c.lineTo(15, .85); c.lineTo(17.4, 3.1); c.closePath(); c.fillStyle = '#e8533d'; c.fill(); c.stroke();

  [[13.55, 3.55], [15.95, 3.55]].forEach(([x, y]) => { rr(c, x, y, .55, .6, .06); c.fillStyle = '#9be0ff'; c.fill(); c.strokeStyle = OUT; c.lineWidth = .05; c.stroke(); c.beginPath(); c.moveTo(x + .275, y); c.lineTo(x + .275, y + .6); c.moveTo(x, y + .3); c.lineTo(x + .55, y + .3); c.lineWidth = .03; c.stroke(); });
  const o = Math.min(1, Math.max(0, door.open)) ;
  rr(c, 14.5, 4.05, 1, .95, .08); c.fillStyle = o > 0 ? '#ffe9a8' : '#a8672d'; c.fill(); c.strokeStyle = OUT; c.lineWidth = .05; c.stroke();
  if (o > 0) { c.beginPath(); c.moveTo(14.5, 4.05); c.lineTo(14.2, 4.15); c.lineTo(14.2, 5.0); c.lineTo(14.5, 5.0); c.closePath(); c.fillStyle = '#a8672d'; c.fill(); c.stroke(); }

}
function drawBalloon(c, b) {
  if (b.gone) return;
  const bob = Math.sin(time * 1.8 + b.ph) * .08, hx = b.x + Math.sin(time * 1.2 + b.ph) * .06, hy = b.y - 1.25 + bob;
  c.strokeStyle = 'rgba(60,50,70,.7)'; c.lineWidth = .02; c.beginPath(); c.moveTo(b.x, b.y); c.quadraticCurveTo(b.x + .12, b.y - .6, hx, hy + .34); c.stroke();
  ell(c, b.x, b.y, .09, .04, 'rgba(0,0,0,.2)');
  c.beginPath(); c.moveTo(hx, hy + .3); c.lineTo(hx - .06, hy + .4); c.lineTo(hx + .06, hy + .4); c.closePath(); c.fillStyle = b.color; c.fill();

function drawDuck(c, d) {
  const j = d.jump > 0 ? Math.sin(d.jump / .45 * Math.PI) * .35 : 0, bob = Math.sin(time * 3 + d.ph) * .02;
  ell(c, d.x, d.y + .05, .42, .16, 'rgba(255,255,255,.35)');
  c.save(); c.translate(d.x, d.y - j + bob); c.scale(d.face, 1);
  ell(c, 0, -.05, .28, .2, '#ffd83a', OUT); ell(c, -.05, -.07, .15, .09, '#f2b705');
  ell(c, .2, -.25, .14, .14, '#ffd83a', OUT); ell(c, .36, -.23, .09, .045, '#ff8a1c', OUT); ell(c, .24, -.28, .025, .025, '#222');
  c.restore();

function drawBall(c) {
  const x = ball.x, y = ball.y - .16;
  ell(c, ball.x, ball.y, .17, .06, 'rgba(0,0,0,.2)');
  c.save(); c.translate(x, y); c.rotate(ball.rot);
  c.beginPath(); c.arc(0, 0, .17, 0, TAU); c.clip();
  ['#ff4f6d', '#fff', '#4fa3ff', '#ffd23f', '#fff', '#5fd17f'].forEach((col, i) => { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, .3, i * Math.PI / 3, (i + 1) * Math.PI / 3); c.closePath(); c.fillStyle = col; c.fill(); });
  c.restore(); c.beginPath(); c.arc(x, y, .17, 0, TAU); c.strokeStyle = OUT; c.lineWidth = .03; c.stroke();

function drawStar(c, s) {

  star(c, s.x, s.y - .3 + b, .24, Math.sin(time * 2 + s.ph) * .2); c.fillStyle = '#ffd23f'; c.fill(); c.strokeStyle = '#d99a00'; c.lineWidth = .04; c.stroke();
  if ((time * 3 + s.ph) % 2 < .3) { star(c, s.x + .2, s.y - .5, .06, 0, 4); c.fillStyle = '#fff'; c.fill(); }

function drawParts(c) {
  for (const p of parts) {
    const a = Math.max(0, Math.min(1, p.life / p.max * 1.6)); c.globalAlpha = a;
    if (p.type === 'spark') { star(c, p.x, p.y, p.size * 2.2, p.rot, 4); c.fillStyle = p.color; c.fill(); }
    else if (p.type === 'conf') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color; c.fillRect(-p.size, -p.size * .5, p.size * 2, p.size); c.restore(); }

  ctx.fillStyle = '#2a8f4a'; ctx.fillRect(0, 0, W, H);

    if (grid[y][x] === G.TREE) items.push({ y: y + .95, f: () => drawTree(c, x, y) });
  items.push({ y: 5, f: () => drawHouse(c) });

function renderCards() {
  cards.forEach((cd, i) => {
    cd.el.classList.toggle('sel', i === sel);
    const g = cd.ctx; g.clearRect(0, 0, 240, 240);
    const on = i === sel, bounce = on ? Math.abs(Math.sin(time * 5)) * 14 : 0;
