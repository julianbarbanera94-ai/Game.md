<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b3f7a">
<title>Park Pals</title>
<style>
  :root { --panel: 190px; --ink: #2b2f55; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3b3f7a; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #view { position: relative; flex: 1; min-height: 0; background: #1f6e3a; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* HUD */
  #hud { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; pointer-events: none; max-width: calc(100% - 172px); }
  .chip { background: linear-gradient(#fff, #e9ecff); border: 3px solid #3c4a7d; border-radius: 20px; padding: 0 8px; font-size: 18px; font-weight: 900; color: var(--ink); display: flex; align-items: center; gap: 4px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .chip.bump { animation: bump .35s; }
  .chip.off { display: none; }
  #area { position: absolute; left: 50%; top: 66px; z-index: 2; pointer-events: none; white-space: nowrap; transform: translate(-50%, -200px); transition: transform .45s cubic-bezier(.3, 1.4, .5, 1);
    background: #fff; border: 4px solid #3c4a7d; border-radius: 12px; padding: 6px 18px; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 6px #b9c4ef, 0 4px 0 rgba(0,0,0,.25);
    font: 900 clamp(18px, 5vw, 24px) "Trebuchet MS", system-ui, sans-serif; color: var(--ink); }
  #area.show { transform: translate(-50%, 0); }
  @keyframes bump { 40% { transform: scale(1.35); } }
  #topbtns { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px; display: flex; gap: 6px; z-index: 3; }
  .tb { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #3c4a7d; background: linear-gradient(#fff, #e9ecff); font-size: 25px; box-shadow: 0 3px 0 rgba(0,0,0,.25); cursor: pointer; padding: 0; }
  .tb:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .playonly { display: none !important; }
  body.playing .playonly { display: flex !important; }

  /* Pokemon-style dialog box */
  #dlg { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: none; pointer-events: none;
    background: #fff; border: 4px solid #3c4a7d; border-radius: 14px; padding: 12px 40px 12px 18px; min-height: 64px;
    box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 6px #b9c4ef, 0 5px 0 rgba(0,0,0,.25);
    font: 900 clamp(19px, 5vw, 26px)/1.25 "Trebuchet MS", system-ui, sans-serif; color: var(--ink); }
  #dlg::after { content: "▼"; position: absolute; right: 14px; bottom: 8px; font-size: 14px; color: #e8334f; animation: blink .8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Title + character select */
  .overlay { position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  .overlay.on { display: flex; }
  #title { background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.25), rgba(20,30,80,.35) 70%); cursor: pointer; }
  #logo { font: 900 clamp(52px, 15vw, 104px)/1 "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; display: flex; gap: .02em; }
  #logo span { display: inline-block; -webkit-text-stroke: 4px #2b2f55; paint-order: stroke fill; text-shadow: 0 7px 0 #2b2f55; animation: hop 1.6s ease-in-out infinite; }
  #logo .gap { width: .3em; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } }
  #parade { width: min(92vw, 520px); height: auto; aspect-ratio: 520 / 150; }
  .press { font: 900 clamp(20px, 5.5vw, 30px) "Trebuchet MS", system-ui, sans-serif; color: #fff; background: #e8334f; border: 4px solid #fff; border-radius: 40px; padding: 8px 26px; box-shadow: 0 5px 0 #8c1f33; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #select { background: rgba(20, 28, 70, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  #select h1 { margin: 0 0 14px; font-size: clamp(26px, 7vw, 44px); color: #fff; text-align: center; -webkit-text-stroke: 3px #2b2f55; paint-order: stroke fill; text-shadow: 0 4px 0 #2b2f55; }
  #cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 760px; }
  .card { position: relative; width: clamp(96px, 27vw, 136px); border: 4px solid #3c4a7d; border-radius: 22px; background: linear-gradient(#ffffff, #e6ebff); padding: 4px 4px 6px; text-align: center; font-weight: 900; font-size: clamp(16px, 4vw, 21px); color: var(--ink); cursor: pointer; transition: transform .12s; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
  .card canvas { width: 100%; height: auto; aspect-ratio: 1; display: block; border-radius: 16px; }
  .card.sel { border-color: #e8334f; transform: scale(1.1); box-shadow: 0 5px 0 rgba(0,0,0,.3), 0 0 0 5px #ffd23f; }
  .card.sel::before { content: "▼"; position: absolute; top: -26px; left: 50%; transform: translateX(-50%); color: #ffd23f; font-size: 22px; -webkit-text-stroke: 2px #2b2f55; animation: hop 1s infinite; }
  #mg { padding: 0; z-index: 6; background: #000; }
  #mgc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #mgClose { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px; z-index: 2; }
  #gs { background: rgba(60, 30, 120, .6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 5; }
  #gs h1 { margin: 0 0 10px; font-size: clamp(26px, 7vw, 44px); color: #fff; -webkit-text-stroke: 3px #2b2f55; paint-order: stroke fill; text-shadow: 0 4px 0 #2b2f55; }
  #gsCards { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 760px; }
  .gcard .gicon { font-size: clamp(44px, 13vw, 64px); line-height: 1.25; }
  #gsClose { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px; }
  #gs .box { background: #fff; border: 4px solid #3c4a7d; border-radius: 14px; padding: 10px 18px; font-weight: 900; font-size: clamp(17px, 4.5vw, 22px); color: var(--ink); }
  #mapov { background: rgba(20, 28, 70, .6); z-index: 5; cursor: pointer; }
  .mapbox { width: min(96%, 760px); aspect-ratio: 4 / 3; max-height: 78%; background: #1b6534; border: 4px solid #3c4a7d; border-radius: 16px; box-shadow: inset 0 0 0 3px #fff, 0 5px 0 rgba(0,0,0,.3); overflow: hidden; }
  .mapbox canvas { width: 100%; height: 100%; display: block; }
  #mapov .box, #select .box { background: #fff; border: 4px solid #3c4a7d; border-radius: 14px; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 6px #b9c4ef; padding: 10px 18px; font-weight: 900; font-size: clamp(17px, 4.5vw, 22px); color: var(--ink); }

  /* Controller */
  #pad { height: calc(var(--panel) + env(safe-area-inset-bottom)); flex: none; position: relative; background: linear-gradient(#4a4f94, #2f3368); border-top: 5px solid #232652; }
  #pad::before { content: "PARK  PALS"; position: absolute; left: 50%; top: 10px; transform: translateX(-50%); font: 900 13px system-ui, sans-serif; letter-spacing: 3px; color: #8d92d8; white-space: pre; }
  #stick { position: absolute; left: 22px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 146px; height: 146px; border-radius: 50%; background: radial-gradient(#23264f, #181a38); box-shadow: inset 0 0 0 5px #5d63b3, 0 4px 0 rgba(0,0,0,.3); }
  #stick::before, #stick::after { content: ""; position: absolute; background: #5d63b3; opacity: .5; }
  #stick::before { left: 50%; top: 14px; bottom: 14px; width: 4px; margin-left: -2px; }
  #stick::after  { top: 50%; left: 14px; right: 14px; height: 4px; margin-top: -2px; }
  #knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9db0, #e8334f 70%); box-shadow: 0 4px 0 #8c1f33; pointer-events: none; }
  .btn { position: absolute; width: 82px; height: 82px; border-radius: 50%; border: 0; font: 900 38px "Trebuchet MS", system-ui, sans-serif; color: #fff; cursor: pointer; text-shadow: 0 2px 0 rgba(0,0,0,.3); padding: 0; }
  .btn.down, .btn:active { transform: translateY(4px); }
  #btnA { right: 20px; bottom: calc(86px + env(safe-area-inset-bottom)); background: radial-gradient(circle at 35% 30%, #7ff0a0, #1fb85a 70%); box-shadow: 0 6px 0 #0e7a38; }
  #btnB { right: 118px; bottom: calc(28px + env(safe-area-inset-bottom)); background: radial-gradient(circle at 35% 30%, #ffe27a, #f5a50f 70%); box-shadow: 0 6px 0 #a56a00; }
  #btnA.down, #btnA:active { box-shadow: 0 2px 0 #0e7a38; }
  #btnB.down, #btnB:active { box-shadow: 0 2px 0 #a56a00; }
  #btnA.glow { animation: glow .8s infinite; }
  @keyframes glow { 50% { box-shadow: 0 6px 0 #0e7a38, 0 0 0 12px rgba(127,240,160,.55); } }

  /* Phones held sideways: controls float over the game */
  @media (max-height: 520px) and (orientation: landscape) {
    #pad { position: absolute; inset: 0; height: auto; background: none; border: 0; pointer-events: none; z-index: 3; }
    #pad::before { display: none; }
    #stick, .btn { pointer-events: auto; opacity: .85; }
    #stick { left: max(18px, env(safe-area-inset-left)); bottom: 14px; width: 128px; height: 128px; }
    #knob { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
    .btn { width: 72px; height: 72px; font-size: 32px; }
    #btnA { right: max(16px, env(safe-area-inset-right)); bottom: 74px; }
    #btnB { right: calc(max(16px, env(safe-area-inset-right)) + 86px); bottom: 22px; }
    #dlg { left: 170px; right: 200px; }
    #logo { font-size: 64px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="hud" class="playonly">
      <div class="chip" id="cStars">⭐ <span>0</span></div>
      <div class="chip rchip" data-r="park" id="cFlowers">🌸 <span>0</span></div>
      <div class="chip rchip" data-r="park north" id="cBalloons">🎈 <span>0</span></div>
      <div class="chip rchip off" data-r="east" id="cShells">🐚 <span>0</span></div>
      <div class="chip rchip off" data-r="south" id="cCarrots">🥕 <span>0</span></div>
      <div class="chip rchip off" data-r="west" id="cFlakes">❄️ <span>0</span></div>
      <div class="chip" id="cCritters">🐾 <span>0</span></div>
    </div>
    <div id="topbtns">
      <button class="tb" id="btnMute" aria-label="Sound">🔊</button>
      <button class="tb playonly" id="btnMap" aria-label="Map">🗺️</button>
      <button class="tb playonly" id="btnSwap" aria-label="Change friend">🔄</button>
    </div>
    <div id="area"></div>
    <div id="dlg"><span id="dlgText"></span></div>
    <div id="title" class="overlay on">
      <div id="logo"></div>
      <canvas id="parade" width="1040" height="300"></canvas>
      <div class="press">▶ Tap to play!</div>
    </div>
    <div id="mg" class="overlay"><canvas id="mgc"></canvas><button class="tb" id="mgClose" aria-label="Close">✖️</button></div>
    <div id="gs" class="overlay">
      <h1>🎮 Game Station</h1>
      <div id="gsCards"></div>
      <div class="box">Pick a game to play! 😊</div>
      <button class="tb" id="gsClose" aria-label="Close">✖️</button>
    </div>
    <div id="mapov" class="overlay">
      <div class="mapbox"><canvas id="mapc"></canvas></div>
      <div class="box">🗺️ Here you are! Tap to close.</div>
    </div>
    <div id="select" class="overlay">
      <h1>Choose your friend!</h1>
      <div id="cards"></div>
      <div class="box">Who do you want to play with today? 😊</div>
    </div>
  </div>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <button class="btn" id="btnA" aria-label="A button">A</button>
    <button class="btn" id="btnB" aria-label="B button">B</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const OUT = '#2a2030';

/* ------------------------------------------------------------------ *
 *  Sound (tiny WebAudio blips, no files needed)
 * ------------------------------------------------------------------ */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d = .15, type = 'sine', vol = .2, to = null, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
function noise(d = .2, vol = .2, freq = 1500, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
  const g = a.createGain(); const t = a.currentTime + delay; g.gain.setValueAtTime(vol, t);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const SFX = {
  pop:    () => { noise(.12, .5, 1800); tone(520, .1, 'sine', .25, 120); },
  chime:  () => { tone(784, .14, 'triangle', .25); tone(1175, .26, 'triangle', .25, null, .09); },
  star:   () => { [988, 1319, 1568].forEach((f, i) => tone(f, .14, 'triangle', .22, null, i * .06)); },
  boing:  () => tone(220, .28, 'sine', .3, 700),
  splash: () => { noise(.35, .45, 900); noise(.25, .3, 2400, .05); tone(400, .15, 'sine', .12, 200); },
  quack:  () => { tone(520, .09, 'sawtooth', .16, 380); tone(480, .11, 'sawtooth', .16, 340, .12); },
  bell:   () => { tone(880, .5, 'sine', .25); tone(660, .7, 'sine', .25, null, .35); },
  yum:    () => { tone(300, .12, 'sine', .25, 500); tone(350, .12, 'sine', .25, 560, .14); tone(420, .2, 'sine', .25, 700, .28); },
  kick:   () => { tone(180, .12, 'sine', .35, 70); noise(.06, .25, 600); },
  hi:     () => { tone(660, .1, 'triangle', .22); tone(880, .14, 'triangle', .22, null, .08); },
  fanfare:() => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .2, 'square', .13, null, i * .11)); },
  voice(id) {
    if (id === 'mickey') { tone(620, .09, 'square', .12, 760); tone(760, .09, 'square', .12, 900, .11); tone(700, .16, 'square', .12, 560, .22); }
    else if (id === 'minnie') { tone(900, .09, 'triangle', .22, 1100); tone(1100, .09, 'triangle', .22, 1300, .11); tone(1000, .16, 'triangle', .22, 800, .22); }
    else if (id === 'donald') { SFX.quack(); tone(400, .12, 'sawtooth', .14, 300, .26); }
    else if (id === 'daisy') { tone(720, .08, 'sawtooth', .1, 560); tone(800, .1, 'sawtooth', .1, 620, .12); tone(1000, .14, 'triangle', .18, 1200, .26); }
    else if (id === 'goofy') { tone(300, .18, 'triangle', .3, 420); tone(420, .3, 'triangle', .3, 260, .18); }
    else { tone(240, .1, 'sawtooth', .22, 150); tone(240, .12, 'sawtooth', .22, 140, .16); }
  }
};

/* ------------------------------------------------------------------ *
 *  Characters (all drawn with shapes, 48 "pixels" tall, feet at 0,0)
 * ------------------------------------------------------------------ */
const ORDER = ['mickey', 'minnie', 'donald', 'daisy', 'goofy', 'pluto'];
const CHARS = {
  mickey: { name: 'Mickey', skin: '#ffd9b0', body: '#26232b', pants: '#e8333d', shoe: '#ffd23f', hand: '#fff', emoji: ['🧀', '⭐', '😄', '🎈'] },
  minnie: { name: 'Minnie', skin: '#ffd9b0', body: '#ff6fb0', pants: '#ff6fb0', shoe: '#ff3d93', hand: '#fff', emoji: ['🎀', '🌸', '💖', '🍰'] },
  donald: { name: 'Donald', skin: '#fff', body: '#3b63c4', pants: '#ffffff', shoe: '#ffb21f', hand: '#fff', emoji: ['🦆', '💦', '⛵', '😆'] },
  daisy:  { name: 'Daisy',  skin: '#fff', body: '#b39cf2', pants: '#ffffff', shoe: '#ff9ccf', hand: '#fff', emoji: ['🎀', '💜', '🌷', '😊'] },
  goofy:  { name: 'Goofy',  skin: '#f2c99a', body: '#ff9a2e', pants: '#45d3e6', shoe: '#9a5a2b', hand: '#fff', emoji: ['😜', '🎣', '🏀', '👍'] },
  pluto:  { name: 'Pluto',  emoji: ['🦴', '🐾', '🎾', '💛'] }
};
const DIRS = { down: { x: 0, y: 1 }, up: { x: 0, y: -1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };

let LW = .04; // outline width: world units normally, 1.5 inside character space
function ell(c, x, y, rx, ry, fill, stroke) {
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = LW; c.stroke(); }
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); rrPath(c, x, y, w, h, r);
}

function drawPerson(c, id, dir, t, moving, wave) {
  const S = CHARS[id], side = dir === 'left' || dir === 'right', back = dir === 'up', front = dir === 'down';
  c.save();
  if (dir === 'left') c.scale(-1, 1);
  const sw = moving ? Math.sin(t * 13) : 0;
  c.translate(0, moving ? -Math.abs(Math.sin(t * 13)) * 1.8 : 0);

  // shoes
  if (side) { ell(c, -3 - sw * 3.5, -3, 6, 3.2, S.shoe, OUT); ell(c, 3 + sw * 3.5, -3.5, 6, 3.2, S.shoe, OUT); }
  else { ell(c, -5, -3 - Math.max(0, sw) * 2.5, 5.5, 3.3, S.shoe, OUT); ell(c, 5, -3 - Math.max(0, -sw) * 2.5, 5.5, 3.3, S.shoe, OUT); }

  // thin mouse tail
  if (id === 'mickey' || id === 'minnie') { c.beginPath(); c.moveTo(side ? -6 : 5, -9); c.bezierCurveTo(side ? -14 : 13, -6, side ? -17 : 16, -16, side ? -13 : 12, -20); c.strokeStyle = '#26232b'; c.lineWidth = 1.3; c.stroke(); }
  // tail for Donald (back view)
  if ((id === 'donald' || id === 'daisy') && back) ell(c, 0, -10, 4, 3, '#fff', OUT);

  // body
  const skirt = id === 'minnie' ? 11.5 : id === 'daisy' ? 9.5 : 8.8, shortsOver = id === 'mickey' || id === 'goofy';
  if (!shortsOver) ell(c, 0, -10.5, skirt, 6.5, S.pants, OUT);
  ell(c, 0, -17, id === 'minnie' || id === 'daisy' ? 8.6 : 9.2, 7.6, S.body, OUT);
  if (id === 'goofy') { if (back) ell(c, 0, -17.5, 8.4, 6.8, '#26232b'); else if (front) { ell(c, -5.6, -17, 3.6, 6.6, '#26232b'); ell(c, 5.6, -17, 3.6, 6.6, '#26232b'); } else ell(c, -2.5, -17, 5.2, 6.6, '#26232b'); }
  if (shortsOver) { ell(c, 0, -10.2, 9.2, id === 'goofy' ? 6.8 : 6, S.pants, OUT); if (id === 'goofy' && !back) { line(c, -3, -16, -3, -22, '#45d3e6', 1.6); line(c, 3, -16, 3, -22, '#45d3e6', 1.6); } }
  ell(c, 3, -13.5, 5.5, 3.5, 'rgba(0,0,0,.08)'); ell(c, -3.5, -20.5, 3.5, 2, 'rgba(255,255,255,.18)');
  if (!back) {
    if (id === 'mickey' && front) { ell(c, -4, -12, 1.5, 2.2, '#fff', OUT); ell(c, 4, -12, 1.5, 2.2, '#fff', OUT); }

function along(pts, f) {
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
  let d = f * L;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) { const t = seg[i] ? Math.min(1, d / seg[i]) : 1; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
    d -= seg[i];
  }
}
function emoBurst(x, y, list, n, size = .42) {

}

function findTarget() {
  const px = P.x, py = P.y - .3, d0 = DIRS[P.dir];
  let best = null, bs = 99;
  const consider = t => {
    const dx = t.x - px, dy = t.y - py, d = Math.hypot(dx, dy); if (d > t.r) return;
    const facing = d > .01 ? (dx * d0.x + dy * d0.y) / d : 1;
    const s = d - facing * .35 + (t.k === 'water' ? .8 : 0);
    if (s < bs) { bs = s; best = t; }
  };
  if (room) {
    for (const o of room.objects) consider({ k: 'room', o, x: o.tx, y: o.ty, my: o.my, r: o.r });
    if (room.npc) consider({ k: 'npc', o: room.npc, x: room.npc.x, y: room.npc.y - .4, my: room.npc.y - 1.55, r: 1.4 });
    return best;
  }
  STATIC_TARGETS.forEach(consider);
  for (const f of flowers) if (!f.gone) consider({ k: 'flower', o: f, x: f.x, y: f.y - .1, my: f.y - (f.kind === 'sunflower' ? 1.15 : .8), r: 1.1 });
  for (const b of balloons) if (!b.gone) consider({ k: 'balloon', o: b, x: b.x, y: b.y - 1.1, my: b.y - 2.1, r: 1.5 });
  for (const it of items) if (!it.gone) consider({ k: 'item', o: it, x: it.x, y: it.y - .1, my: it.y - .85, r: 1.1 });
  for (const n of friends) consider({ k: 'friend', o: n, x: n.x, y: n.y - .4, my: n.y - 1.55, r: 1.4 });
  for (const p of pets) consider({ k: 'pet', o: p, x: p.x, y: p.y - .3, my: p.y - 1.25, r: 1.4 });
  for (const d of ducks) consider({ k: 'duck', o: d, x: d.x, y: d.y - .2, my: d.y - .95, r: 2.1 });
  for (const k of critters) if (k.life > .5) consider({ k: 'critter', o: k, x: k.x, y: k.y - .3, my: k.y - 1.15, r: 1.5 });
  for (const b of balls) consider({ k: 'ball', o: b, x: b.x, y: b.y - .2, my: b.y - 1.0, r: 1.1 });
  let bw = null, bd = 9;
  for (let ty = Math.floor(py) - 2; ty <= Math.floor(py) + 2; ty++) for (let tx = Math.floor(px) - 2; tx <= Math.floor(px) + 2; tx++) {
    const g = gAt(tx, ty); if (g !== WATER && g !== OCEAN) continue;
    const d = Math.hypot(tx + .5 - px, ty + .5 - py); if (d < bd) { bd = d; bw = { k: 'water', x: tx + .5, y: ty + .5, my: ty - .1, r: 1.45 }; }
  }
  if (bw) consider(bw);
  return best;
}
