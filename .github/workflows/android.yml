name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk farmstead-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: farmstead-debug-apk
          path: farmstead-debug.apk
      - name: Publish to the "android-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Farmstead test build (latest)
          prerelease: true
          files: farmstead-debug.apk
          body: |
            Debug build of Farmstead for testing. Built from ${{ github.ref_name }} @ ${{ github.sha }}.
            Install: download farmstead-debug.apk on your Android phone, open it and allow "install unknown apps" when asked.
